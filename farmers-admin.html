<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المزارعين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css"></head><body>
<header class="hero"><h1>لوحة <span>المزارعين</span></h1></header>
<main class="wrap" id="login"><div class="card">
<label for="em">البريد الإلكتروني</label><input type="email" id="em" dir="ltr">
<label for="pw">كلمة المرور</label><input type="password" id="pw" dir="ltr">
<button id="in">دخول</button><div class="msg err" id="lm"></div></div></main>
<main class="wrap wide" id="panel" hidden><div class="stats" style="grid-template-columns:1fr"><div class="stat"><b id="n">0</b>إجمالي المشاركين</div></div>
<div class="card"><table><thead><tr><th>الاسم</th><th>القبيلة</th><th>سيزرع</th><th>واتساب</th><th></th></tr></thead><tbody id="rows"></tbody></table>
<button id="out" style="background:var(--line);color:var(--text)">تسجيل خروج</button></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const $=id=>document.getElementById(id);let unsub=null;
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
$('in').onclick=()=>auth.signInWithEmailAndPassword($('em').value,$('pw').value).catch(()=>$('lm').textContent='بيانات الدخول غير صحيحة');
$('out').onclick=()=>auth.signOut();
auth.onAuthStateChanged(u=>{$('login').hidden=!!u;$('panel').hidden=!u;if(unsub){unsub();unsub=null}
 if(u)unsub=db.collection('farmers').orderBy('createdAt','desc').onSnapshot(s=>{
  $('n').textContent=s.size;
  $('rows').innerHTML=s.docs.map(d=>{const f=d.data(),w=esc(f.whatsapp).replace(/[^0-9]/g,'');
   return `<tr><td>${esc(f.name)}</td><td>${esc(f.tribe)}</td><td>${esc(f.crop)}</td><td dir="ltr"><a href="https://wa.me/${w}" target="_blank">${esc(f.whatsapp)}</a></td><td><button class="sm" data-id="${d.id}">حذف</button></td></tr>`}).join('')||'<tr><td colspan="5">لا يوجد مشاركون</td></tr>';
  document.querySelectorAll('button.sm').forEach(b=>b.onclick=()=>confirm('حذف؟')&&db.collection('farmers').doc(b.dataset.id).delete())})});
</script></body></html>

<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل السائقين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css"></head><body>
<header class="hero"><h1>سجّل كـ<span>سائق</span> معنا</h1><p>تاكسي · نقل بضائع · سيارة سحب</p></header>
<main class="wrap"><div class="card">
<label for="name">الاسم</label><input type="text" id="name" autocomplete="name">
<label for="phone">رقم الهاتف</label><input type="tel" id="phone" dir="ltr" style="text-align:right" placeholder="09XXXXXXXX">
<label>نوع الخدمة</label><div class="opts">
<label class="opt"><input type="radio" name="type" value="تاكسي" checked><span><b>🚕</b>تاكسي</span></label>
<label class="opt"><input type="radio" name="type" value="نقل بضائع"><span><b>🚚</b>نقل بضائع</span></label>
<label class="opt"><input type="radio" name="type" value="سيارة سحب"><span><b>🏗️</b>سيارة سحب</span></label></div>
<label>الجنس</label><div class="opts two">
<label class="opt"><input type="radio" name="gender" value="رجل" checked><span>رجل</span></label>
<label class="opt"><input type="radio" name="gender" value="امرأة"><span>امرأة</span></label></div>
<button id="send">تسجيل</button><div class="msg" id="msg"></div></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const msg=document.getElementById('msg');
const say=(t,c)=>{msg.textContent=t;msg.className='msg '+c};
document.getElementById('send').onclick=async()=>{
  const name=document.getElementById('name').value.trim(),phone=document.getElementById('phone').value.trim();
  if(name.length<3)return say('أدخل الاسم','err');
  if(!/^[0-9+\s]{9,15}$/.test(phone))return say('رقم الهاتف غير صحيح','err');
  try{
    await db.collection('drivers').add({name,phone,
      type:document.querySelector('input[name=type]:checked').value,
      gender:document.querySelector('input[name=gender]:checked').value,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    document.getElementById('name').value='';document.getElementById('phone').value='';
    say('تم التسجيل بنجاح ✓','ok');
  }catch(e){say('تعذر الإرسال، حاول مجددًا','err')}
};
</script></body></html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدخال بيانات إلى Firestore</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-container {
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    .input-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #555;
    }

    input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    #statusMessage {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="form-container">
    <h2>إدخال بيانات إلى Firestore</h2>
    <div class="input-group">
      <label for="name">الاسم:</label>
      <input type="text" id="name" placeholder="أدخل الاسم الكامل">
    </div>
    <div class="input-group">
      <label for="email">البريد الإلكتروني:</label>
      <input type="email" id="email" placeholder="example@domain.com">
    </div>
    <button id="submitBtn">حفظ في Firestore</button>
    <p id="statusMessage"></p>
  </div>

  <!-- كود ربط وإدخال البيانات لـ Firestore -->
  <script type="module">
    import {initializeApp} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import {getAnalytics} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
    // استيراد دوال Firestore الحديثة
    import {getFirestore, collection, addDoc} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    // إعدادات مشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyBzLZxIGum-QQ4vEvGsaozAqDQDyUiW54k",
      authDomain: "as12-d6210.firebaseapp.com",
      databaseURL: "https://as12-d6210-default-rtdb.firebaseio.com",
      projectId: "as12-d6210",
      storageBucket: "as12-d6210.firebasestorage.app",
      messagingSenderId: "490183773270",
      appId: "1:490183773270:web:d8a8ff4be981d20f0afff7",
      measurementId: "G-VGS5MVSTQE"
    };

    // تهيئة Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);

    // تهيئة خدمة Firestore
    const db = getFirestore(app);

    // ربط الحدث بالزر عند الضغط عليه
    document.getElementById("submitBtn").addEventListener("click", async () => {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const statusMessage = document.getElementById("statusMessage");

      if (!name || !email) {
        statusMessage.style.color = "red";
        statusMessage.innerText = "الرجاء تعبئة جميع الحقول!";
        return;
      }

      try {
        // إضافة مستند جديد إلى مجموعة (Collection) تسمى "users"
        const docRef = await addDoc(collection(db, "users"), {
          name: name,
          email: email,
          createdAt: new Date()
        });

        statusMessage.style.color = "green";
        statusMessage.innerText = "تم حفظ البيانات بنجاح برقم تعريف: " + docRef.id;

        // تفريغ الحقول بعد الحفظ
        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
      } catch (error) {
        statusMessage.style.color = "red";
        statusMessage.innerText = "حدث خطأ: " + error.message;
      }
    });
  </script>

</body>

</html>
